name: NeuroLab H08d D0 real debugger transport fixture
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neurolab-h08d-d0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: windows-2022
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile owned x86 fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x86 unavailable' }
          $vc = Join-Path $vs 'VC\Auxiliary\Build\vcvars32.bat'
          $batch = Join-Path $env:RUNNER_TEMP 'nl-build-fixture.cmd'
          @"
          @call "$vc" >nul
          @if errorlevel 1 exit /b 1
          @cl /nologo /Od /Zi /Fe:fixture.exe experiments\h08d_fixture.c /link /DEBUG /PDB:fixture.pdb
          "@ | Set-Content -Path $batch -Encoding ascii
          cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path fixture.exe)) { throw 'Fixture build failed' }
      - name: Test real debugger on fixture only
        shell: pwsh
        run: |
          python -u experiments/h08d_d0.py fixture.exe
          if ($LASTEXITCODE -ne 0) { throw 'D0 did not pass' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h08d-d0-derived
          path: h08d-d0-result.json
          if-no-files-found: warn
          retention-days: 30
